model_list:
  # ── Fast: Alibaba Qwen Turbo (low latency) ── TESTED OK 2.4s
  - model_name: jarvis-fast
    litellm_params:
      model: openai/qwen-turbo
      api_base: os.environ/ALIBABA_BASE_URL
      api_key: os.environ/ALIBABA_API_KEY

  # ── Balanced: Alibaba Qwen Plus ──
  - model_name: jarvis-balanced
    litellm_params:
      model: openai/qwen-plus
      api_base: os.environ/ALIBABA_BASE_URL
      api_key: os.environ/ALIBABA_API_KEY

  # ── Smart: Alibaba Qwen Max ──
  - model_name: jarvis-smart
    litellm_params:
      model: openai/qwen-max
      api_base: os.environ/ALIBABA_BASE_URL
      api_key: os.environ/ALIBABA_API_KEY

  # ── Vision: Qwen VL Max (multimodal) ── TESTED OK
  - model_name: jarvis-vision
    litellm_params:
      model: openai/qwen-vl-max
      api_base: os.environ/ALIBABA_BASE_URL
      api_key: os.environ/ALIBABA_API_KEY

  # ── Coder: Claude Sonnet 4.6 via AWS Bedrock ── TESTED OK 1.5s
