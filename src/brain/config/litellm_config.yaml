      model: openai/deepseek/deepseek-v4-flash
      api_base: https://gen.pollinations.ai/v1
      api_key: os.environ/POLLINATIONS_API_KEY

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  timeout: 45
  fallbacks:
    - jarvis-fast:
        - jarvis-groq-instant
        - jarvis-gemini-fast
        - jarvis-groq-fast
        - jarvis-cohere-fast
        - jarvis-th-free
        - jarvis-poll-fast
        - jarvis-pooled-fast
    - jarvis-balanced:
        - jarvis-groq-smart
        - jarvis-gemini-fast
        - jarvis-cohere-smart
        - jarvis-apertis-balanced
        - jarvis-th-free
        - jarvis-poll-balanced
    - jarvis-smart:
        - jarvis-ali-max
        - jarvis-gemini-smart
        - jarvis-mistral-smart
        - jarvis-groq-smart
        - jarvis-or-smart
        - jarvis-poll-smart
        - jarvis-balanced
        - jarvis-coder
    - jarvis-coder:
        - jarvis-ali-coder
        - jarvis-ali-kimi-code
        - jarvis-mistral-coder
        - jarvis-anyapi-coder
        - jarvis-smart
        - jarvis-gemini-smart
        - jarvis-smart-cc
        - jarvis-or-smart
    - jarvis-reason:
        - jarvis-ali-think
        - jarvis-ali-qwq
        - jarvis-cohere-reason
        - jarvis-ali-deepseek-pro
        - jarvis-poll-reason
        - jarvis-groq-smart
        - jarvis-pooled-smart
        - jarvis-smart
        - jarvis-coder
    - jarvis-vision:
        - jarvis-or-vision
        - jarvis-atessa-vision
        - jarvis-gemini-fast
        - jarvis-balanced
    - jarvis-cheap:
        - jarvis-groq-instant
        - jarvis-cohere-fast
        - jarvis-anyapi-fast
        - jarvis-poll-fast
        - jarvis-or-cheap
        - jarvis-th-free
        - jarvis-pooled-fast
        - jarvis-fast
  allowed_fails: 2
  cooldown_time: 60
