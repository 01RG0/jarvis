# /etc/nginx/sites-available/jarvis
# Generated by deploy.sh — replace DOMAIN with actual domain (e.g. 51.12.208.62.nip.io)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Next.js static files (standalone mode)
    location /_next/static/ {
        alias /home/rootuser/jarvis/src/website/.next/standalone/.next/static/;
        expires 1y;
        access_log off;
    }

    # Gateway WebSocket + REST (Node.js, port 8080)
    location /gateway/ {
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }

    # Brain WebSocket endpoints (FastAPI, port 8001) — /ws/logs, /ws/stats, /pc-ws
    location /ws/ {
        proxy_pass http://localhost:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }

    # Brain REST API (FastAPI, port 8001) — /brain/dashboard/, /brain/api/, etc.
    location /brain/ {
        proxy_pass http://localhost:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120;
    }

    # Voice pipeline WebSocket (Pipecat, port 8765) — match with and without trailing slash
    location ~* ^/voice-pipeline(/.*)?$ {
        proxy_pass http://localhost:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }

    # Next.js website (standalone, port 3000)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60;
    }
}
